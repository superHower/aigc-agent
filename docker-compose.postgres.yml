services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aigc
      POSTGRES_USER: aigc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigc -d aigc"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    environment:
      DATABASE_URL: postgresql://aigc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aigc
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
