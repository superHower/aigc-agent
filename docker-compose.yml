services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    platform: linux/amd64
    env_file:
      - .env
    environment:
      DATA_DIR: /app/backend/media
      DATABASE_PATH: /app/backend/data/tasks.db
      FRONTEND_ORIGINS: http://localhost:8080
    volumes:
      - backend-media:/app/backend/media
      - backend-data:/app/backend/data
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  natapp:
    build:
      context: ./docker/natapp
    platform: linux/amd64
    depends_on:
      - frontend
    network_mode: "service:frontend"
    environment:
      NATAPP_AUTHTOKEN: ${NATAPP_AUTHTOKEN:-}
    volumes:
      - natapp-client:/opt/natapp
    restart: unless-stopped

volumes:
  backend-media:
  backend-data:
  natapp-client:
